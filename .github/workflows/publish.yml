name: Publish Khanpanion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed application commit SHA (blank uses the competition release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhanAcademy-Backtrack/KhanAcademy-Backtrack-Demo
          ref: ${{ inputs.source_ref || 'fc9b3d93f0accb80793415bf8d19b0e806a93f8a' }}
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the pinned dependencies
        run: npm ci
      - name: Run the application tests
        run: npm test
      - name: Build the static application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Record the source revision
        run: |
          touch out/.nojekyll
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          writeFileSync('out/release.json', JSON.stringify({repository: 'KhanAcademy-Backtrack/KhanAcademy-Backtrack-Demo', commit}) + '\n');
          NODE
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
