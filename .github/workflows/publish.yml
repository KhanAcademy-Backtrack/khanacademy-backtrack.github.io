name: Publish Khanpanion

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tested static release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release receipt
        run: |
          python3 - <<'RECEIPT'
          import json, re
          from pathlib import Path
          assert Path('site/index.html').is_file(), 'Missing homepage'
          assert Path('site/.nojekyll').is_file(), 'Missing static-site marker'
          receipt = json.loads(Path('site/release.json').read_text())
          assert receipt['repository'] == 'KhanAcademy-Backtrack/KhanAcademy-Backtrack-Demo'
          assert re.fullmatch(r'[0-9a-f]{40}', receipt['commit'])
          print('Publishing application revision ' + receipt['commit'])
          RECEIPT
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
